name: Factory copies

# Called by every consumer: fails when a skill in skills-lock.json, or the
# .github/labels.yml or WORKFLOW.md copy, differs from its pinned commit, or
# when the root AGENTS.md lacks a Factory section entry that WORKFLOW.md
# reads. See AGENTS.md (How a change reaches the repos).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Copies match their pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Reinstall every pinned skill from scratch
        # Deleting first makes a file added by hand show up as deleted.
        run: |
          for name in $(jq --raw-output '.skills | keys[]' skills-lock.json); do
            rm -rf ".agents/skills/$name" ".claude/skills/$name"
          done
          npx --yes skills@1.9.0 experimental_install --frozen-lockfile --agent claude-code --agent codex
      - name: Compare the labels and WORKFLOW.md with the pinned factory commit
        run: |
          set -o pipefail
          commit=$(jq --raw-output '[.skills[] | select(.source == "langmail/factory") | .commit] | unique
            | if length == 1 then .[0] else error("skills-lock.json pins langmail/factory at \(length) commits") end' skills-lock.json)
          for pair in labels.yml:.github/labels.yml WORKFLOW.md:WORKFLOW.md; do
            curl --fail --silent --show-error "https://raw.githubusercontent.com/langmail/factory/$commit/${pair%%:*}" \
              | diff --unified - "${pair#*:}" \
              || { echo "::error::${pair#*:} differs from langmail/factory $commit. Change it in langmail/factory and take the sync PR."; exit 1; }
          done
      - name: AGENTS.md has every Factory section entry WORKFLOW.md lists
        run: |
          # One section: from its heading to the next level-two heading, with
          # line ends and trailing blanks ignored.
          extract() { awk -v heading="$1" '{ sub(/[ \t\r]+$/, "") } /^## /{ on = ($0 == heading) } on' "$2"; }
          section=$(extract "## Factory" AGENTS.md)
          entries=$(extract "## The Factory section" WORKFLOW.md | grep --only-matching '^- \*\*[^*]*:\*\*' || true)
          [ -n "$section" ] || { echo "::error::AGENTS.md has no ## Factory section (WORKFLOW.md, The Factory section)."; exit 1; }
          [ -n "$entries" ] || { echo "::error::WORKFLOW.md lists no Factory section entries."; exit 1; }
          missing=0
          while IFS= read -r entry; do
            awk -v entry="$entry" 'index($0, entry) == 1 { found = 1 } END { exit !found }' <<<"$section" \
              || { echo "::error::The ## Factory section of AGENTS.md has no '$entry' entry (WORKFLOW.md, The Factory section)."; missing=1; }
          done <<<"$entries"
          exit "$missing"
      - name: Fail on any difference
        run: |
          if [ -n "$(git status --porcelain -- .agents .claude skills-lock.json)" ]; then
            git status --short -- .agents .claude skills-lock.json
            git diff -- .agents .claude skills-lock.json
            echo "::error::A pinned skill differs from skills-lock.json. Change a shared skill in langmail/factory and take the sync PR; re-pin a repo's own third-party skill with the skills CLI."
            exit 1
          fi
