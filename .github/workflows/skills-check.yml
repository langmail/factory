name: Shared skills

# Called by every consumer repo. Reinstalls each skill in skills-lock.json at
# its pinned commit and fails when the committed copy differs, so a hand edit
# to a shared skill never stays unnoticed. Change a shared skill in
# langmail/factory, or upstream for a third-party one.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Copies match skills-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reinstall every pinned skill
        run: npx --yes skills@1.9.0 experimental_install --frozen-lockfile --force --agent claude-code --agent codex
      - name: Fail on any difference
        run: |
          git add --intent-to-add --all -- .agents .claude
          if ! git diff --exit-code -- .agents .claude skills-lock.json; then
            echo "::error::A shared skill differs from skills-lock.json. Change it in langmail/factory (or upstream for a third-party skill), then take the sync PR."
            exit 1
          fi
