name: Sync

# Brings every consumer to a release: see AGENTS.md (How a change reaches the
# repos). The install job runs the skills CLI and holds no secret; the sync
# job holds the App token and runs only our own Node script and pinned
# actions.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.consumers.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only a vX.Y.Z tag on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/install.mjs "$RUNNER_TEMP/installed" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed
          path: |
            ${{ runner.temp }}/installed/.agents/skills
            ${{ runner.temp }}/installed/skills-lock.json
          include-hidden-files: true
      - id: consumers
        run: echo "repos=$(jq --compact-output .consumers factory.json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: install
    runs-on: ubuntu-latest
    # The App's private key is a secret of this environment, which only v*
    # tags may deploy to.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.install.outputs.repos) }}
    env:
      REPO: langmail/${{ matrix.repo }}
      BRANCH: chore/factory-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: factory
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installed
          path: installed
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.FACTORY_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_SYNC_PRIVATE_KEY }}
          owner: langmail
          repositories: ${{ matrix.repo }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.REPO }}
          token: ${{ steps.app.outputs.token }}
          path: repo
      - name: Apply the release, continuing an earlier run's branch
        working-directory: repo
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch --quiet origin "$BRANCH"
            git switch --create "$BRANCH" FETCH_HEAD
          else
            git switch --create "$BRANCH"
          fi
          node ../factory/scripts/apply.mjs ../installed . "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Open the sync PR, wait for its checks and merge it
        working-directory: repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          git add --all
          if ! git diff --cached --quiet; then
            bot_id=$(gh api "users/$BOT" --jq .id)
            git -c user.name="$BOT" -c user.email="$bot_id+$BOT@users.noreply.github.com" \
              commit --quiet --message "chore(factory): sync to $GITHUB_REF_NAME"
            git push --quiet origin "$BRANCH"
          fi
          if git diff --quiet origin/main HEAD; then
            echo "$REPO is already at $GITHUB_REF_NAME"
            exit 0
          fi

          number=$(gh api "repos/$REPO/pulls?head=langmail:$BRANCH&state=open" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh api "repos/$REPO/pulls" --jq .number \
              -f title="chore(factory): sync to $GITHUB_REF_NAME" -f head="$BRANCH" -f base=main \
              -f body="Brings the shared skills and factory workflows to [langmail/factory $GITHUB_REF_NAME](https://github.com/langmail/factory/tree/$GITHUB_REF_NAME). The factory's sync job merges it once every check is green; the change was reviewed in langmail/factory.")
          fi
          head=$(git rev-parse HEAD)

          # Every check run on the head, once the skills check is among them
          # and all have finished: green when each succeeded or was skipped.
          sleep 120
          for _ in $(seq 1 86); do
            state=$(gh api "repos/$REPO/commits/$head/check-runs?per_page=100" --jq '
              .check_runs as $runs
              | if ($runs | map(select(.name | endswith("Copies match skills-lock.json"))) | length) == 0 then "waiting"
                elif ($runs | any(.status != "completed")) then "waiting"
                elif ($runs | all(.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral")) then "green"
                else "red" end')
            [ "$state" != waiting ] && break
            sleep 30
          done
          if [ "$state" != green ]; then
            echo "::error::Checks on $REPO#$number are $state; the PR stays open for a human."
            exit 1
          fi
          gh api -X PUT "repos/$REPO/pulls/$number/merge" -f merge_method=squash -f sha="$head" --silent
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" --silent || true
