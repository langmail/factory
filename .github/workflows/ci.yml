name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Nothing private in shared files
        run: scripts/leak-check.sh
      - name: A release installs and applies to a consumer
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/install.mjs "$RUNNER_TEMP/installed" "$COMMIT"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer/.github/workflows"
          echo "    uses: langmail/factory/.github/workflows/skills-check.yml@v0.0.0" > "$consumer/.github/workflows/factory.yml"
          node scripts/apply.mjs "$RUNNER_TEMP/installed" "$consumer" v9.9.9 "$COMMIT"
          cd "$consumer"
          for dir in "$GITHUB_WORKSPACE"/skills/*/; do
            name=$(basename "$dir")
            diff -r "$dir" ".agents/skills/$name"
            test "$(readlink ".claude/skills/$name")" = "../../.agents/skills/$name"
            jq --exit-status --arg name "$name" --arg commit "$COMMIT" '.skills[$name].commit == $commit' skills-lock.json
          done
          grep --quiet "skills-check.yml@$COMMIT # v9.9.9" .github/workflows/factory.yml
